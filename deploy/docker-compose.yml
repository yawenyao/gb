# GB 2760 三服务一键启动：Neo4j + 后端 + 前端
# 在项目根目录执行：docker compose -f deploy/docker-compose.yml up -d --build

services:
  neo4j:
    image: neo4j:5.14-community
    container_name: gb2760-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: gb2760-backend
    container_name: gb2760-backend
    ports:
      - "8080:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: neo4j123
      DATASET_PATH: /app/dataset
    volumes:
      - ../data-extraction/output/foodmate_dataset:/app/dataset:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: gb2760-frontend
    container_name: gb2760-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
